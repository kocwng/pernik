# komik with a different spot colour: Sea blue.
extends = "komik"
accents = ["#2F6FDB", "#1C1520", "#BCD2F6"]
name = "komik-laut"

[komik]
paper = "#F4F7FC"
spot = "#2F6FDB"
tint = "#BCD2F6"

# Dark mode: a night print. Dark paper that sits close to GitHub's dark page, soft light
# lines instead of white, and a deeper tint so large areas don't glare.
[komik.dark]
paper = "#161B22"
ink = "#A9B2BD"
spot = "#5B8DEB"
tint = "#1E2F4F"
shade = "#010409"
solid = "#2C4A85"
on_solid = "#F2E9EF"

[colors]
pink = "#2F6FDB"
jeruk = "#2F6FDB"
mint = "#2F6FDB"
langit = "#2F6FDB"
kuning = "#BCD2F6"
cream = "#F4F7FC"
