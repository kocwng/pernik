# komik with a different spot colour: Orange.
extends = "komik"
accents = ["#E8682E", "#1C1520", "#F8C8AE"]
name = "komik-jeruk"

[komik]
paper = "#FCF5F0"
spot = "#E8682E"
tint = "#F8C8AE"

# Dark mode: a night print. Dark paper that sits close to GitHub's dark page, soft light
# lines instead of white, and a deeper tint so large areas don't glare.
[komik.dark]
paper = "#161B22"
ink = "#A9B2BD"
spot = "#EE7F4A"
tint = "#432819"
shade = "#010409"
solid = "#7A3C1F"
on_solid = "#F2E9EF"

[colors]
pink = "#E8682E"
jeruk = "#E8682E"
mint = "#E8682E"
langit = "#E8682E"
kuning = "#F8C8AE"
cream = "#FCF5F0"
