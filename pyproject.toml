[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pernik"
version = "0.1.0"
description = "Playful, theme-aware widgets for GitHub profile READMEs. No server: SVGs built into your own repo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); CC BY 4.0 (art, see LICENSE)" }
authors = [{ name = "kocwng" }]
keywords = ["github", "readme", "profile", "svg", "widgets", "batik"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
# only needed for the mixtape widget's chord detection and video
mixtape = ["numpy", "scipy", "pillow"]

[project.scripts]
pernik = "pernik.__main__:main"

[project.urls]
Homepage = "https://github.com/kocwng/pernik"

[tool.setuptools.packages.find]
include = ["pernik*"]

[tool.setuptools.package-data]
pernik = ["themes/*.toml", "**/*.html", "**/*.json", "**/*.svg"]
